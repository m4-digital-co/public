<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IPTV — Browse playlists</title>
  <meta name="description" content="Free, public playlists for the IPTV app. Scan or tap to add one and start watching." />
  <meta name="color-scheme" content="dark light" />
  <!-- QR generator (pure JS). If it fails to load, cards still work — QR just hides. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    :root {
      --bg: #0b0f14; --card: #131a22; --line: #223040; --text: #e8eef5;
      --dim: #93a4b8; --accent: #4f8cff; --accent-ink: #04122b; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #16233a 0%, var(--bg) 55%) no-repeat, var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 940px; margin: 0 auto; padding: 32px 20px 64px; }
    header { text-align: center; margin-bottom: 32px; }
    .brand { letter-spacing: 6px; font-weight: 800; font-size: 14px; color: var(--accent); }
    h1 { font-size: clamp(26px, 5vw, 40px); margin: 8px 0 6px; }
    .lead { color: var(--dim); max-width: 560px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .card h3 { margin: 0; font-size: 20px; }
    .sub { color: var(--dim); font-size: 14px; margin: 0; }
    .qr { align-self: center; background: #fff; border-radius: 10px; padding: 8px; line-height: 0; }
    .qr img { width: 148px; height: 148px; display: block; image-rendering: pixelated; }
    .row { display: flex; gap: 10px; margin-top: auto; }
    .btn {
      flex: 1; text-align: center; text-decoration: none; cursor: pointer;
      padding: 11px 14px; border-radius: 10px; font-weight: 700; font-size: 15px;
      border: 1px solid var(--line); background: #0f1620; color: var(--text);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .note { color: var(--dim); font-size: 12px; text-align: center; }
    .state { text-align: center; color: var(--dim); padding: 48px 0; }
    footer { text-align: center; color: var(--dim); font-size: 13px; margin-top: 40px; }
    footer a { color: var(--accent); }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f3f6fb; --card:#fff; --line:#dbe4ef; --text:#0d1826; --dim:#5a6b80; --accent-ink:#fff; }
      body { background: radial-gradient(1200px 600px at 50% -10%, #dce9ff 0%, var(--bg) 55%) no-repeat, var(--bg); }
      .btn { background:#f0f4fa; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">I P T V</div>
      <h1>Browse playlists</h1>
      <p class="lead">Free, public playlists. Open one on the device running the IPTV app to add it, or scan the QR with your phone.</p>
    </header>
    <main id="main"><div class="state">Loading…</div></main>
    <footer>Don’t have the app? <a href="../">Get IPTV</a>.</footer>
  </div>

  <script>
    "use strict";
    // ── Share codec (mirror of the app's src/data/shareLink.ts) ──────────────
    var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    function utf8Bytes(str) {
      var b = [];
      for (var i = 0; i < str.length; i++) {
        var c = str.charCodeAt(i);
        if (c < 0x80) b.push(c);
        else if (c < 0x800) b.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
        else if (c >= 0xd800 && c <= 0xdbff) {
          var c2 = str.charCodeAt(++i);
          var cp = 0x10000 + ((c & 0x3ff) << 10) + (c2 & 0x3ff);
          b.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f));
        } else b.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
      }
      return b;
    }
    function b64url(bytes) {
      var out = '';
      for (var i = 0; i < bytes.length; i += 3) {
        var n = (bytes[i] << 16) | ((bytes[i + 1] || 0) << 8) | (bytes[i + 2] || 0);
        out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63];
        if (i + 1 < bytes.length) out += B64[(n >> 6) & 63];
        if (i + 2 < bytes.length) out += B64[n & 63];
      }
      return out;
    }
    function encodeShare(src) {
      var p = src.type === 'xtream'
        ? { t: 'xt', n: src.name, h: src.baseUrl, s: src.username, p: src.password, o: src.output }
        : { t: 'm3u', n: src.name, u: src.url, e: src.epgUrl, a: src.userAgent };
      Object.keys(p).forEach(function (k) { if (p[k] == null || p[k] === '') delete p[k]; });
      return 'IPTV1.' + b64url(utf8Bytes(JSON.stringify(p)));
    }
    // The app itself lives one level up (…/iptv/), and handles #add= links.
    var APP_BASE = location.href.split('#')[0].replace(/[^/]*$/, '');
    function deeplink(share) { return 'iptv://add?c=' + share; }
    function weblink(share) { return APP_BASE + '#add=' + share; }

    function qrDataUrl(text) {
      if (typeof qrcode === 'undefined') return null;
      try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createDataURL(5, 4); } catch (e) { return null; }
    }
    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

    function card(entry) {
      var src = { type: entry.type === 'xtream' ? 'xtream' : 'm3u', name: entry.name,
        url: entry.url, epgUrl: entry.epgUrl, userAgent: entry.userAgent,
        baseUrl: entry.baseUrl, username: entry.username, output: entry.output };
      var share = encodeShare(src);
      var c = el('div', 'card');
      c.appendChild(el('h3', null, entry.name || 'Playlist'));
      var sub = [entry.region, entry.description].filter(Boolean).join(' · ');
      if (sub) c.appendChild(el('p', 'sub', sub));
      var qr = qrDataUrl(weblink(share));
      if (qr) { var w = el('div', 'qr'); var img = new Image(); img.src = qr; w.appendChild(img); c.appendChild(w); }
      var row = el('div', 'row');
      var open = el('a', 'btn primary', 'Open in app'); open.href = deeplink(share); row.appendChild(open);
      var copy = el('button', 'btn', 'Copy link');
      copy.onclick = function () {
        (navigator.clipboard ? navigator.clipboard.writeText(weblink(share)) : Promise.reject())
          .then(function () { copy.textContent = 'Copied!'; setTimeout(function () { copy.textContent = 'Copy link'; }, 1500); })
          .catch(function () { prompt('Copy this link:', weblink(share)); });
      };
      row.appendChild(copy);
      c.appendChild(row);
      if (entry.type === 'xtream') c.appendChild(el('p', 'note', 'You’ll enter the password on your device.'));
      return c;
    }
    function render() {
      var main = document.getElementById('main');
      fetch('./catalog.json', { headers: { Accept: 'application/json' } })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (j) {
          var list = (j && j.playlists) || [];
          main.innerHTML = '';
          if (!list.length) { main.appendChild(el('div', 'state', 'No playlists yet.')); return; }
          var grid = el('div', 'grid');
          list.forEach(function (e) { grid.appendChild(card(e)); });
          main.appendChild(grid);
        })
        .catch(function () { main.innerHTML = '<div class="state">Couldn’t load the directory. Refresh to try again.</div>'; });
    }
    render();
  </script>
</body>
</html>
